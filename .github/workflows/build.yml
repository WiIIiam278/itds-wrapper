name: Build Wrapper

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: false
        type: string

env:
  Version: ${{ inputs.version == '' && format('1.0.{0}', github.run_number) || inputs.version }}
  AssemblyVersion: ${{ inputs.version == '' && format('1.0.{0}', github.run_number) || inputs.version }}

jobs:
  build-ios-wrapper:
    runs-on: 'macos-26'
    steps:
    # Setup
    - name: 'Checkout repository'
      uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '10.0.x'
    - name: Set-up s5cmd
      uses: jonko0493/action-setup-s5cmd@windows-and-noflaky
      with:
        version: v2.3.0
    - name: 'Download ROM'
      run: |
        s5cmd cp s3://into-the-dream-spring-builds/itds.nds ./
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        S3_ENDPOINT_URL: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
      
    - name: 'Checkout melonDS DS'
      uses: actions/checkout@v5
      with:
        repository: jonko0493/melonds-ds
        ref: use-my-fork
        path: melondsds
        clean: false
    - name: Install Dependencies (macOS)
      if: ${{ matrix.platform.image == 'macos-26' }}
      shell: bash
      run: brew install pkg-config cmake ninja ccache

    # Build melonDS DS
    - name: 'Build melonDS DS'
      run: |
        pushd melondsds
        cmake -B build -Wno-deprecated -DCMAKE_BUILD_TYPE="Release" --toolchain ./cmake/toolchain/ios.toolchain.cmake -DPLATFORM=OS64 -DDEPLOYMENT_TARGET=14 -DENABLE_OGLRENDERER=OFF -DCMAKE_APPLE_SILICON_PROCESSOR="arm64" -DENABLE_JIT=OFF -DBUILD_AS_SHARED_LIBRARY=ON
        cmake --build build
        popd
        cp melondsds/build/src/libretro/melondsds_libretro.dylib ITDSWrapper.iOS/melondsds_libretro.framework/melondsds_libretro
        install_name_tool -id @rpath/melondsds_libretro.framework/melondsds_libretro ITDSWrapper.iOS/melondsds_libretro.framework/melondsds_libretro

    - name: 'Set version in plist'
      run: sed -i '' -e 's/WRAPPER_VERSION/$Version/g' ITDSWrapper.iOS/Info.plist

    - name: Import signing certificate
      uses: Apple-Actions/import-codesign-certs@v5
      with:
        p12-file-base64: ${{ secrets.DISTRIBUTION_CERT_P12 }}
        p12-password: ${{ secrets.DISTRIBUTION_CERT_PASSWORD }}

    - name: 'Download Provisioning Profiles'
      uses: apple-actions/download-provisioning-profiles@v4
      id: profiles
      with:
        bundle-id: 'com.intothedreamspring.itdswrapper'
        profile-type: 'IOS_APP_STORE'
        issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

    - name: Select profile
      id: prof
      env:
        PROFILES: ${{ steps.profiles.outputs.profiles }}
      run: |
        UUID=$(jq -r '[.[] | select(.type == "IOS_APP_STORE")][0].udid' <<< "$PROFILES")
        NAME=$(jq -r '[.[] | select(.type == "IOS_APP_STORE")][0].name' <<< "$PROFILES")
        [ -n "$UUID" ] && [ "$UUID" != "null" ] || { echo "No IOS_APP_STORE profile found"; echo "$PROFILES"; exit 1; }
        echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
        echo "name=$NAME" >> "$GITHUB_OUTPUT"

    - name: Install iOS Workload
      run: dotnet workload install ios
    - name: Set Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'

    - name: Restore & Publish Wrapper
      run: |
        dotnet build -f net10.0-ios -c Release -p:RuntimeIdentifier=ios-arm64
        dotnet publish -f net10.0-ios -c Release -p:ArchiveOnBuild=true -p:RuntimeIdentifier=ios-arm64 -p:CodesignKey="Apple Distribution" -p:CodesignProvision="${{ steps.prof.outputs.uuid }}"
      shell: pwsh

    - name: Upload to TestFlight
      uses: apple-actions/upload-testflight-build@v4
      with: 
        app-path: 'ITDSWrapper.iOS/bin/Release/net10.0-ios/ios-arm64/publish/ITDSWrapper.iOS.ipa' 
        issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
        api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
        api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        # release-notes: todo: input please # optional
        uses-non-exempt-encryption: 'false' # optional: "true" or "false" maps directly to App Store Connect usesNonExemptEncryption
        wait-for-processing: 'true' # optional: set to "false" to skip waiting (metadata updates will be skipped)
        backend: AppStoreAPI # optional: AppStoreAPI | transporter | altool (default: AppStoreAPI; case insensitive)

  build-android-wrapper:            
    runs-on: 'ubuntu-latest'
    steps:
    # Setup
    - name: 'Checkout repository'
      uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '10.0.x'
    - name: Set-up s5cmd
      uses: jonko0493/action-setup-s5cmd@windows-and-noflaky
      with:
        version: v2.3.0
    - name: 'Download ROM'
      run: |
        s5cmd cp s3://into-the-dream-spring-builds/itds.nds ./
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        S3_ENDPOINT_URL: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
      
    - name: 'Checkout melonDS DS'
      uses: actions/checkout@v5
      with:
        repository: jonko0493/melonds-ds
        ref: use-my-fork
        path: melondsds
        clean: false
    - name: Install Dependencies (Linux)
      uses: awalsh128/cache-apt-pkgs-action@v1.4.3
      with:
        packages: ccache cmake libepoxy-dev libopengl0 libopengl-dev ninja-build p7zip-full x11-xserver-utils xdg-utils xvfb
        version: 1.2

    # Android-specific setup
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1.5.0
      with:
        ndk-version: r26d
    - name: Install Android .NET workload
      run: dotnet workload install android
    - name: Make libs dir
      run: mkdir -p ITDSWrapper.Android/libs/arm64-v8a

    # Build melonDS DS
    - name: 'Build melonDS DS'
      run: |
        pushd melondsds
        cmake -B build -Wno-deprecated -DCMAKE_BUILD_TYPE="Release" -DENABLE_OGLRENDERER=OFF -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" -DENABLE_LTO_RELEASE=OFF
        cmake --build build
        popd
        cp melondsds/build/src/libretro/melondsds_libretro_android.so ITDSWrapper.Android/libs/arm64-v8a/libmelondsds_libretro.so

    # Build & Publish
    - name: Restore & Publish Wrapper
      run: |
        dotnet restore ITDSWrapper.Android -r android-arm64
        dotnet publish ITDSWrapper.Android/ITDSWrapper.Android.csproj -c Release -f net10.0-android -r android-arm64 --self-contained /p:DebugType=None /p:DebugSymbols=false /p:PublishSingleFile=false
    - name: 'Upload wrappers to bucket'
      run: s5cmd cp ITDSWrapper.Android/bin/Release/net10.0-android/android-arm64/publish/com.intothedreamspring.itdswrapper-Signed.apk s3://into-the-dream-spring-wrapper/com.intothedreamspring.itdswrapper.apk
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        S3_ENDPOINT_URL: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

  build-steam-wrappers:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - image: 'ubuntu-latest'
            tfm: net10.0
            rid: 'linux-x64'
            single_file: true
            melondsds_src: build/src/libretro/melondsds_libretro.so
            melondsds_dst: ITDSWrapper.Desktop/melondsds_libretro.so
            cmake_flags: ''
            shell: 'bash'
            artifact: 'publish'
            steamworks_target: 'publish'
          - image: 'macos-26'
            tfm: net10.0-macos
            rid: 'osx-x64'
            single_file: false
            melondsds_src: build/src/libretro/melondsds_libretro.dylib
            melondsds_dst: ITDSWrapper.Desktop/melondsds_libretro.dylib
            cmake_flags: '-DCMAKE_OSX_ARCHITECTURES:STRING="x86_64" -DENABLE_OGLRENDERER=OFF -DCMAKE_APPLE_SILICON_PROCESSOR="x86_64" -DBUILD_AS_SHARED_LIBRARY=ON'
            shell: 'bash'
            artifact: 'ITDSWrapper.Desktop.app'
            steamworks_target: 'ITDSWrapper.Desktop.app/Contents/MacOS'
          - image: 'macos-26'
            tfm: net10.0-macos
            rid: 'osx-arm64'
            single_file: false
            melondsds_src: build/src/libretro/melondsds_libretro.dylib
            melondsds_dst: ITDSWrapper.Desktop/melondsds_libretro.dylib
            cmake_flags: '-DCMAKE_OSX_ARCHITECTURES:STRING="arm64" -DENABLE_OGLRENDERER=OFF -DCMAKE_APPLE_SILICON_PROCESSOR="arm64" -DENABLE_JIT=OFF -DBUILD_AS_SHARED_LIBRARY=ON'
            shell: 'bash'
            artifact: 'ITDSWrapper.Desktop.app'
            steamworks_target: 'ITDSWrapper.Desktop.app/Contents/MacOS'
          - image: 'windows-latest'
            tfm: net10.0
            rid: 'win-x64'
            single_file: true
            melondsds_src: build/src/libretro/melondsds_libretro.dll
            melondsds_dst: ITDSWrapper.Desktop/melondsds_libretro.dll
            cmake_flags: '-DENABLE_SCCACHE=ON -DSCCACHE="C:/Users/runneradmin/.cargo/bin/sccache.exe" -DENABLE_LTO_RELEASE=OFF'
                          # Temporarily disable LTO until a regression in GCC 15 is resolved https://github.com/msys2/MINGW-packages/issues/24152
            shell: 'msys2 {0}'
            artifact: 'publish'
            steamworks_target: 'publish'
    runs-on: ${{ matrix.platform.image }}
    defaults:
      run:
        shell: ${{ matrix.platform.shell }}
    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '10.0.x'
    - name: Set-up s5cmd
      uses: jonko0493/action-setup-s5cmd@windows-and-noflaky
      with:
        version: v2.3.0
    - name: 'Download ROM'
      run: s5cmd cp s3://into-the-dream-spring-builds/itds.nds ./
      shell: pwsh
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        S3_ENDPOINT_URL: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

    - name: 'Checkout melonDS DS'
      uses: actions/checkout@v5
      with:
        repository: jonko0493/melonds-ds
        ref: use-my-fork
        path: melondsds
        clean: false
    - name: Install Dependencies (Linux)
      if: ${{ matrix.platform.image == 'ubuntu-latest' }}
      uses: awalsh128/cache-apt-pkgs-action@v1.4.3
      with:
        packages: ccache cmake libepoxy-dev libopengl0 libopengl-dev ninja-build p7zip-full x11-xserver-utils xdg-utils xvfb
        version: 1.2
    - name: Install Dependencies (macOS)
      if: ${{ matrix.platform.image == 'macos-26' }}
      shell: bash
      run: brew install pkg-config cmake ninja ccache
    - name: Install MSYS2 Dependencies (Windows)
      uses: msys2/setup-msys2@v2
      if: ${{ matrix.platform.image == 'windows-latest' }}
      with:
        msystem: MINGW64
        update: true
        install: git pkgconf mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
    - name: Install CCache
      uses: hendrikmuhs/ccache-action@53911442209d5c18de8a31615e0923161e435875
      if: ${{ matrix.platform.image == 'windows-latest' }}
      with:
        key: win-x64-Release
        variant: 'sccache'
        # Using sccache on Windows due to https://github.com/hendrikmuhs/ccache-action/issues/112
        verbose: 2
        evict-old-files: job

    - name: 'Build melonDS DS'
      run: |
        pushd melondsds
        cmake -B build -Wno-deprecated -DCMAKE_BUILD_TYPE="Release" ${{ matrix.platform.cmake_flags }}
        cmake --build build
        popd
        cp melondsds/${{ matrix.platform.melondsds_src }} ${{ matrix.platform.melondsds_dst }}

    - name: Install macOS Workload
      run: dotnet workload install macos
      if: ${{ matrix.platform.tfm == 'net10.0-macos' }}
    - name: Set Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.6'
      if: ${{ matrix.platform.tfm == 'net10.0-macos' }}
    - name: Restore & Publish Wrapper
      run: |
        dotnet restore ITDSWrapper.Desktop/ITDSWrapper.Desktop.csproj -p:RuntimeIdentifier=${{ matrix.platform.rid }}
        dotnet publish ITDSWrapper.Desktop/ITDSWrapper.Desktop.csproj -c Release -f ${{ matrix.platform.tfm }} -r ${{ matrix.platform.rid }} --self-contained -p:DebugType=None -p:DebugSymbols=false -p:PublishSingleFile=${{ matrix.platform.single_file }}
      shell: pwsh
    - name: Restore & Publish SteamworksHelper
      run: |
        dotnet restore SteamworksHelper/SteamworksHelper.csproj -p:RuntimeIdentifier=${{ matrix.platform.rid }}
        dotnet publish SteamworksHelper/SteamworksHelper.csproj -c Release -f net10.0 -r ${{ matrix.platform.rid }} --self-contained -p:DebugType=None -p:DebugSymbols=false -p:PublishSingleFile=true
        mv SteamworksHelper/bin/Release/net10.0/${{ matrix.platform.rid }}/publish/* ITDSWrapper.Desktop/bin/Release/${{ matrix.platform.tfm }}/${{ matrix.platform.rid }}/${{ matrix.platform.steamworks_target }}/
      shell: pwsh
    - name: Zip wrapper
      run: Compress-Archive -Path ITDSWrapper.Desktop/bin/Release/${{ matrix.platform.tfm }}/${{ matrix.platform.rid }}/${{ matrix.platform.artifact }}/* -DestinationPath ./publish.zip
      shell: pwsh
    - name: 'Upload wrappers to bucket'
      run: |
        mv publish.zip ${{ matrix.platform.rid }}.zip
        s5cmd cp ${{ matrix.platform.rid }}.zip s3://into-the-dream-spring-wrapper/
      shell: pwsh
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        S3_ENDPOINT_URL: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

  upload-to-steam:
    runs-on: ubuntu-latest
    needs: build-steam-wrappers
    steps:
    - name: 'Checkout repository'
      uses: actions/checkout@v5
      with:
        path: itds-wrapper
        clean: false
    - name: Set-up s5cmd
      uses: jonko0493/action-setup-s5cmd@windows-and-noflaky
      with:
        version: v2.3.0
    - name: Make steam dir
      run: mkdir -p steam/macos
    - name: 'Download Wrappers'
      run: |
        s5cmd cp s3://into-the-dream-spring-wrapper/*.zip ./
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        S3_ENDPOINT_URL: "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
    - name: Unzip Wrappers
      run: |
        Expand-Archive -Path linux-x64.zip -DestinationPath steam/linux-x64
        Expand-Archive -Path osx-x64.zip -DestinationPath macos-x64
        Expand-Archive -Path osx-arm64.zip -DestinationPath macos-arm64
        Expand-Archive -Path win-x64.zip -DestinationPath steam/win-x64
      shell: pwsh
    - name: Construct macOS app bundle
      run: |
        mkdir -p steam/macos/Into\ the\ Dream\ Spring.X64.app/
        mkdir -p steam/macos/Into\ the\ Dream\ Spring.ARM64.app/
        cp itds-wrapper/ITDSWrapper.Desktop/macos/ITDSWrapper steam/macos/ITDSWrapper
        cp -r macos-x64/* steam/macos/Into\ the\ Dream\ Spring.X64.app/
        cp -r macos-arm64/* steam/macos/Into\ the\ Dream\ Spring.ARM64.app/
      shell: bash
    - name: Deploy to Steam
      uses: game-ci/steam-deploy@v3
      with:
        username: ${{ secrets.STEAM_USERNAME }}          
        configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
        appId: '4026050'
        buildDescription: ${{ github.run_id }}
        rootPath: steam
        depot1Path: win-x64
        depot2Path: linux-x64
        depot3Path: macos
        releaseBranch: prerelease
      continue-on-error: true